<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prop Tracker">
<meta name="theme-color" content="#0f0f0f">
<title>Prop Firm Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --bg: #0f0f0f;
  --bg2: #1a1a1a;
  --bg3: #242424;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0f0f0;
  --text2: #888;
  --text3: #555;
  --green: #00e676;
  --green-bg: rgba(0,230,118,0.08);
  --green-border: rgba(0,230,118,0.2);
  --amber: #ffb74d;
  --amber-bg: rgba(255,183,77,0.08);
  --red: #ff5252;
  --red-bg: rgba(255,82,82,0.08);
  --red-border: rgba(255,82,82,0.2);
  --accent: #00e676;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; }
body { overflow-x: hidden; }

.app { max-width: 430px; margin: 0 auto; padding-bottom: 100px; }

/* NAV */
.nav { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 14px 20px 12px; display: flex; justify-content: space-between; align-items: center; }
.nav-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.nav-sub { font-size: 11px; color: var(--text2); margin-top: 1px; font-family: 'DM Mono', monospace; }
.nav-pill { background: var(--green-bg); border: 0.5px solid var(--green-border); border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 500; color: var(--green); font-family: 'DM Mono', monospace; }

/* TABS */
.tabs { display: flex; padding: 16px 20px 0; gap: 6px; }
.tab { flex: 1; padding: 9px 0; font-size: 13px; font-weight: 500; border: 0.5px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text2); cursor: pointer; transition: all 0.18s; }
.tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }

/* SECTION */
.section { padding: 20px 20px 0; }
.section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--text3); text-transform: uppercase; margin-bottom: 12px; font-family: 'DM Mono', monospace; }

/* CARDS */
.card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.firm-name { font-size: 16px; font-weight: 700; }
.firm-sub { font-size: 11px; color: var(--text2); margin-top: 2px; font-family: 'DM Mono', monospace; }
.badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.04em; }
.badge-ready { background: var(--green-bg); color: var(--green); border: 0.5px solid var(--green-border); }
.badge-progress { background: var(--amber-bg); color: var(--amber); border: 0.5px solid rgba(255,183,77,0.2); }
.badge-danger { background: var(--red-bg); color: var(--red); border: 0.5px solid var(--red-border); }

.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
.stat { background: var(--bg3); border-radius: var(--radius-sm); padding: 10px 12px; }
.stat-label { font-size: 10px; color: var(--text2); margin-bottom: 3px; font-family: 'DM Mono', monospace; }
.stat-val { font-size: 15px; font-weight: 700; font-family: 'DM Mono', monospace; }
.stat-val.pos { color: var(--green); }
.stat-val.neg { color: var(--red); }
.stat-val.neutral { color: var(--text); }

.prog-row { margin-bottom: 14px; }
.prog-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text2); margin-bottom: 6px; font-family: 'DM Mono', monospace; }
.prog-bg { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }

.dots-row { margin-bottom: 14px; }
.dots-label { font-size: 11px; color: var(--text2); margin-bottom: 8px; font-family: 'DM Mono', monospace; }
.dots { display: flex; gap: 6px; }
.dot { width: 28px; height: 28px; border-radius: 50%; border: 0.5px solid var(--border2); background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; transition: all 0.2s; }
.dot.win { background: var(--green); border-color: var(--green); color: #000; font-weight: 700; }

.entry-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.entry-input { flex: 1; background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; font-family: 'DM Mono', monospace; padding: 0 12px; height: 42px; outline: none; }
.entry-input:focus { border-color: var(--accent); }
.entry-input::placeholder { color: var(--text3); }
.btn-validate { height: 42px; padding: 0 16px; background: var(--accent); color: #000; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Syne', sans-serif; white-space: nowrap; }
.btn-validate:active { opacity: 0.8; transform: scale(0.97); }
.btn-icon { height: 42px; width: 42px; background: var(--bg3); border: 0.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.btn-icon:active { opacity: 0.7; }
.btn-icon.danger { color: var(--red); }

.hist-toggle { font-size: 11px; color: var(--text3); cursor: pointer; background: none; border: none; display: flex; align-items: center; gap: 4px; font-family: 'DM Mono', monospace; padding: 2px 0; }
.hist-list { margin-top: 10px; border-top: 0.5px solid var(--border); padding-top: 10px; }
.hist-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 0.5px solid var(--border); font-size: 12px; font-family: 'DM Mono', monospace; }
.hist-item:last-child { border-bottom: none; }
.hist-date { color: var(--text2); }
.hist-val { font-weight: 500; }
.hist-val.pos { color: var(--green); }
.hist-val.neg { color: var(--red); }
.hist-tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; }
.hist-tag.win { background: var(--green-bg); color: var(--green); border: 0.5px solid var(--green-border); }
.hist-tag.loss { background: var(--border); color: var(--text3); }

/* ADD BUTTON */
.btn-add { width: 100%; padding: 14px; border: 0.5px dashed var(--border2); border-radius: var(--radius); background: transparent; color: var(--text2); cursor: pointer; font-size: 13px; font-family: 'Syne', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
.btn-add:active { background: var(--bg2); }

/* TRÉSO TAB */
.treso-settings { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
.setting-row:last-child { border-bottom: none; padding-bottom: 0; }
.setting-row:first-child { padding-top: 0; }
.setting-label { font-size: 13px; color: var(--text2); }
.setting-input { background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; font-family: 'DM Mono', monospace; padding: 6px 10px; width: 120px; outline: none; text-align: right; }
.setting-input:focus { border-color: var(--accent); }

.scenario-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.sc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.sc-name { font-size: 14px; font-weight: 700; }
.sc-name.opt { color: var(--green); }
.sc-name.rea { color: var(--amber); }
.sc-name.pes { color: var(--red); }
.sc-desc { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--text3); }
.sc-base-row { display: flex; justify-content: space-between; font-size: 12px; padding: 8px 0; border-bottom: 0.5px solid var(--border); margin-bottom: 6px; font-family: 'DM Mono', monospace; }
.sc-base-label { color: var(--text2); }
.sc-base-val { color: var(--text); font-weight: 500; }
.sc-account-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 0.5px solid var(--border); }
.sc-account-row:last-of-type { border-bottom: none; }
.sc-acc-name { font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; }
.sc-acc-days { font-size: 10px; color: var(--text3); margin-top: 2px; font-family: 'DM Mono', monospace; }
.sc-acc-val { font-size: 13px; font-weight: 700; font-family: 'DM Mono', monospace; }
.sc-acc-val.pos { color: var(--green); }
.sc-acc-val.blocked { color: var(--text3); }
.sc-total-row { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; margin-top: 10px; border-top: 0.5px solid var(--border2); }
.sc-total-label { font-size: 12px; color: var(--text2); }
.sc-total-val { font-size: 22px; font-weight: 700; font-family: 'DM Mono', monospace; }
.sc-total-val.green { color: var(--green); }
.sc-total-val.amber { color: var(--amber); }

/* MODAL */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: flex-end; justify-content: center; }
.overlay.open { display: flex; }
.modal { background: var(--bg2); border-radius: var(--radius) var(--radius) 0 0; border-top: 0.5px solid var(--border2); padding: 20px 20px 40px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 20px; }
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 20px; }
.form-group { margin-bottom: 14px; }
.form-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; display: block; letter-spacing: 0.05em; text-transform: uppercase; font-family: 'DM Mono', monospace; }
.form-input { width: 100%; background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 15px; padding: 12px 14px; outline: none; font-family: 'Syne', sans-serif; }
.form-input:focus { border-color: var(--accent); }
.form-select { width: 100%; background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 15px; padding: 12px 14px; outline: none; font-family: 'Syne', sans-serif; appearance: none; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-btns { display: flex; gap: 10px; margin-top: 20px; }
.btn-save { flex: 1; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Syne', sans-serif; }
.btn-cancel { flex: 1; padding: 14px; background: var(--bg3); color: var(--text); border: 0.5px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; cursor: pointer; font-family: 'Syne', sans-serif; }

/* EMPTY STATE */
.empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
.empty i { font-size: 32px; display: block; margin-bottom: 12px; }

/* PAGE VISIBILITY */
.page { display: none; }
.page.active { display: block; }
</style>
</head>
<body>
<div class="app">

  <div class="nav">
    <div>
      <div class="nav-title">Prop Tracker</div>
      <div class="nav-sub" id="nav-sub">0 compte · 90% split · 5j requis</div>
    </div>
    <div class="nav-pill" id="nav-pill">0 €</div>
  </div>

  <div class="tabs" style="margin-bottom:4px">
    <button class="tab active" onclick="switchTab('comptes')">Comptes</button>
    <button class="tab" onclick="switchTab('treso')">Trésorerie</button>
  </div>

  <!-- PAGE COMPTES -->
  <div class="page active" id="page-comptes">
    <div class="section">
      <div class="section-label" style="margin-top:16px">Mes comptes</div>
      <div id="accounts-list"></div>
      <button class="btn-add" onclick="openModal()">
        <i class="ti ti-plus" style="font-size:16px"></i> Ajouter un compte
      </button>
    </div>
  </div>

  <!-- PAGE TRÉSO -->
  <div class="page" id="page-treso">
    <div class="section">
      <div class="section-label" style="margin-top:16px">Paramètres</div>
      <div class="treso-settings">
        <div class="setting-row">
          <span class="setting-label">Tréso de départ (€)</span>
          <input class="setting-input" type="number" id="treso-base" value="10500" step="100" oninput="renderScenarios()">
        </div>
        <div class="setting-row">
          <span class="setting-label">Taux $/€</span>
          <input class="setting-input" type="number" id="fx-rate" value="0.93" step="0.01" oninput="renderScenarios()">
        </div>
      </div>
      <div class="section-label">Projections</div>
      <div id="scenarios-block"></div>
    </div>
  </div>

</div>

<!-- MODAL COMPTE -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Nouveau compte</div>
    <div class="form-group">
      <label class="form-label">Prop firm</label>
      <select class="form-select" id="f-firm">
        <option>Topstep</option>
        <option>Lucid</option>
        <option>MyFundedFX</option>
        <option>Tradeify</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Taille ($)</label>
        <input class="form-input" type="number" id="f-size" placeholder="50000">
      </div>
      <div class="form-group">
        <label class="form-label">Balance ($)</label>
        <input class="form-input" type="number" id="f-balance" placeholder="50000">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Objectif payout ($)</label>
      <input class="form-input" type="number" id="f-target" placeholder="53000">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Drawdown restant ($)</label>
        <input class="form-input" type="number" id="f-drawdown" placeholder="2000">
      </div>
      <div class="form-group">
        <label class="form-label">Jours acquis</label>
        <input class="form-input" type="number" id="f-days" placeholder="0" min="0" max="5">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="saveAccount()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const SPLIT = 0.9, DAYS_REQ = 5, WIN_THR = 150;
const SCENARIOS = [
  { key:'opt', label:'Optimiste', cls:'opt', desc:'Tous les jours = +150 $', pattern:[{pnl:150,win:true}] },
  { key:'rea', label:'Raisonnable', cls:'rea', desc:'2j/3 à +150 $, 1j/3 à -230 $', pattern:[{pnl:150,win:true},{pnl:150,win:true},{pnl:-230,win:false}] },
  { key:'pes', label:'Pessimiste', cls:'pes', desc:'1j/2 à +150 $, 1j/2 à -230 $', pattern:[{pnl:150,win:true},{pnl:-230,win:false}] }
];

let accounts = [], nextId = 1, showHist = {}, editingId = null;

function save() { try { localStorage.setItem('pft_accounts', JSON.stringify(accounts)); localStorage.setItem('pft_nextId', nextId); } catch(e){} }
function load() { try { const d=localStorage.getItem('pft_accounts'); if(d){ accounts=JSON.parse(d); nextId=parseInt(localStorage.getItem('pft_nextId'))||accounts.length+1; } } catch(e){} }

function fmt(n) { return Math.round(n).toLocaleString('fr-FR'); }
function fmtSign(n) { const r=Math.round(n); return (r>=0?'+':'')+r.toLocaleString('fr-FR'); }
function getBase() { return parseFloat(document.getElementById('treso-base').value)||10500; }
function getFx() { return parseFloat(document.getElementById('fx-rate').value)||0.93; }

function simulateAccount(acc, scenario) {
  let balance=acc.balance, gainDays=acc.gainDays, day=0, pi=0;
  const pat=scenario.pattern;
  while(day<120){
    const d=pat[pi%pat.length]; pi++; day++;
    balance+=d.pnl;
    if(d.win) gainDays=Math.min(gainDays+1,DAYS_REQ+10);
    if(gainDays>=DAYS_REQ && balance>=acc.target) return {reachable:true,days:day,profitNet:Math.round((balance-acc.size)*SPLIT),finalBalance:Math.round(balance)};
    if(balance<=acc.size-acc.drawdown) return {reachable:false,days:day,profitNet:0,reason:'drawdown'};
  }
  return gainDays>=DAYS_REQ ? {reachable:true,days:120,profitNet:Math.round((balance-acc.size)*SPLIT)} : {reachable:false,days:120,profitNet:0,reason:'timeout'};
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='comptes')||(i===1&&tab==='treso')));
  document.getElementById('page-comptes').classList.toggle('active',tab==='comptes');
  document.getElementById('page-treso').classList.toggle('active',tab==='treso');
  if(tab==='treso') renderScenarios();
}

function renderAccounts() {
  const list=document.getElementById('accounts-list');
  if(accounts.length===0){ list.innerHTML=`<div class="empty"><i class="ti ti-chart-line"></i>Aucun compte.<br>Ajoute ton premier compte prop firm.</div>`; updateNav(); return; }
  list.innerHTML='';
  accounts.forEach(acc=>{
    const profit=acc.balance-acc.size;
    const prog=Math.min(100,Math.max(0,Math.round((acc.balance-acc.size)/(acc.target-acc.size)*100)));
    const ddPct=Math.round(acc.drawdown/(acc.size*0.05)*100);
    const ready=acc.gainDays>=DAYS_REQ&&acc.balance>=acc.target;
    const danger=ddPct<30;
    const bCls=ready?'ready':danger?'danger':'progress';
    const bLbl=ready?'PAYOUT OK':danger?'DANGER':acc.gainDays+'/5 jours';
    const progColor=prog>=80?'#00e676':prog>=40?'#ffb74d':'#ff5252';
    const dots=Array.from({length:DAYS_REQ},(_,i)=>`<div class="dot${i<acc.gainDays?' win':''}">${i<acc.gainDays?'✓':i+1}</div>`).join('');
    const hs=showHist[acc.id];
    let hHTML='';
    if(hs&&acc.history.length>0){
      hHTML=`<div class="hist-list">${acc.history.slice(0,15).map(h=>`
        <div class="hist-item">
          <span class="hist-date">${h.date}</span>
          <span class="hist-val ${h.val>=0?'pos':'neg'}">${fmtSign(h.val)} $</span>
          <span class="hist-tag ${h.win?'win':'loss'}">${h.win?'+1 jour':'—'}</span>
        </div>`).join('')}</div>`;
    }
    const iid=`inp-${acc.id}`;
    list.innerHTML+=`
    <div class="card">
      <div class="card-top">
        <div><div class="firm-name">${acc.firm}</div><div class="firm-sub">${fmt(acc.size)} $ · 90% split</div></div>
        <span class="badge badge-${bCls}">${bLbl}</span>
      </div>
      <div class="stats-grid">
        <div class="stat"><div class="stat-label">Balance</div><div class="stat-val neutral">${fmt(acc.balance)} $</div></div>
        <div class="stat"><div class="stat-label">P&L total</div><div class="stat-val ${profit>=0?'pos':'neg'}">${fmtSign(profit)} $</div></div>
        <div class="stat"><div class="stat-label">Drawdown restant</div><div class="stat-val ${ddPct<30?'neg':'neutral'}">${fmt(acc.drawdown)} $</div></div>
        <div class="stat"><div class="stat-label">Payout net</div><div class="stat-val pos">+${fmt((acc.target-acc.size)*SPLIT)} $</div></div>
      </div>
      <div class="prog-row">
        <div class="prog-label"><span>Progression objectif</span><span>${prog}%</span></div>
        <div class="prog-bg"><div class="prog-fill" style="width:${prog}%;background:${progColor}"></div></div>
      </div>
      <div class="dots-row">
        <div class="dots-label">Jours de gain — ${acc.gainDays}/${DAYS_REQ} (seuil 150 $)</div>
        <div class="dots">${dots}</div>
      </div>
      <div class="entry-row">
        <input class="entry-input" type="number" id="${iid}" placeholder="P&L du jour ($)" step="1">
        <button class="btn-validate" onclick="submitEntry(${acc.id},'${iid}')">Valider</button>
        <button class="btn-icon" onclick="openModal(${acc.id})" aria-label="Modifier"><i class="ti ti-edit" style="font-size:16px"></i></button>
        <button class="btn-icon danger" onclick="deleteAccount(${acc.id})" aria-label="Supprimer"><i class="ti ti-trash" style="font-size:16px"></i></button>
      </div>
      <button class="hist-toggle" onclick="toggleHist(${acc.id})">
        <i class="ti ti-${hs?'chevron-up':'chevron-down'}" style="font-size:12px"></i>
        ${acc.history.length>0?`Historique (${acc.history.length} entrée${acc.history.length>1?'s':''})`:"Pas encore d'entrées"}
      </button>
      ${hHTML}
    </div>`;
  });
  updateNav();
}

function renderScenarios() {
  const base=getBase(), fx=getFx();
  const block=document.getElementById('scenarios-block');
  if(!block) return;
  if(accounts.length===0){ block.innerHTML=`<div class="empty" style="padding:20px 0"><i class="ti ti-calculator"></i>Ajoute des comptes pour voir les projections.</div>`; return; }
  let html='';
  SCENARIOS.forEach(sc=>{
    let totalEur=0, rowsHTML='';
    accounts.forEach(acc=>{
      const sim=simulateAccount(acc,sc);
      const eur=Math.round(sim.profitNet*fx);
      if(sim.reachable) totalEur+=eur;
      rowsHTML+=`
        <div class="sc-account-row">
          <div>
            <div class="sc-acc-name">${acc.firm} · ${fmt(acc.size)} $</div>
            <div class="sc-acc-days">${sim.reachable?`~${sim.days} jours de trading`:sim.reason==='drawdown'?'Drawdown atteint':'Non atteint (120j)'}</div>
          </div>
          <div class="sc-acc-val ${sim.reachable?'pos':'blocked'}">${sim.reachable?'+'+fmt(eur)+' €':'—'}</div>
        </div>`;
    });
    const total=base+totalEur;
    html+=`
    <div class="scenario-card">
      <div class="sc-header">
        <span class="sc-name ${sc.cls}">${sc.label}</span>
        <span class="sc-desc">${sc.desc}</span>
      </div>
      <div class="sc-base-row"><span class="sc-base-label">Tréso de départ</span><span class="sc-base-val">${fmt(base)} €</span></div>
      ${rowsHTML}
      <div class="sc-total-row">
        <span class="sc-total-label">Tréso après payouts</span>
        <span class="sc-total-val ${total>base?'green':'amber'}">${fmt(total)} €</span>
      </div>
    </div>`;
  });
  block.innerHTML=html;
}

function updateNav() {
  const fx=getFx(), base=getBase();
  const realPat=SCENARIOS[1].pattern;
  let total=base;
  accounts.forEach(acc=>{ const sim=simulateAccount(acc,SCENARIOS[1]); if(sim.reachable) total+=Math.round(sim.profitNet*fx); });
  document.getElementById('nav-sub').textContent=`${accounts.length} compte${accounts.length>1?'s':''} · 90% split · 5j requis`;
  document.getElementById('nav-pill').textContent=fmt(total)+' €';
}

function submitEntry(id, iid) {
  const inp=document.getElementById(iid);
  const val=parseFloat(inp.value);
  if(isNaN(val)) return;
  const acc=accounts.find(a=>a.id===id);
  if(!acc) return;
  const isWin=val>=WIN_THR;
  acc.balance=Math.round((acc.balance+val)*100)/100;
  acc.drawdown=Math.max(0,Math.round((acc.drawdown-Math.max(0,-val))*100)/100);
  if(isWin) acc.gainDays=Math.min(acc.gainDays+1,DAYS_REQ);
  const d=new Date();
  acc.history.unshift({date:d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}),val:Math.round(val),win:isWin});
  inp.value='';
  save();
  renderAccounts();
  renderScenarios();
}

function toggleHist(id){ showHist[id]=!showHist[id]; renderAccounts(); }

function openModal(id) {
  editingId=id||null;
  document.getElementById('modal-title').textContent=id?'Modifier le compte':'Nouveau compte';
  if(id){ const acc=accounts.find(a=>a.id===id); document.getElementById('f-firm').value=acc.firm; document.getElementById('f-size').value=acc.size; document.getElementById('f-balance').value=acc.balance; document.getElementById('f-target').value=acc.target; document.getElementById('f-drawdown').value=acc.drawdown; document.getElementById('f-days').value=acc.gainDays; }
  else { ['f-size','f-balance','f-target','f-drawdown'].forEach(i=>document.getElementById(i).value=''); document.getElementById('f-days').value='0'; document.getElementById('f-firm').value='Topstep'; }
  document.getElementById('overlay').classList.add('open');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }

function saveAccount() {
  const firm=document.getElementById('f-firm').value;
  const size=parseFloat(document.getElementById('f-size').value);
  const balance=parseFloat(document.getElementById('f-balance').value);
  const target=parseFloat(document.getElementById('f-target').value);
  const drawdown=parseFloat(document.getElementById('f-drawdown').value);
  const days=Math.min(5,parseInt(document.getElementById('f-days').value)||0);
  if(!firm||isNaN(size)||isNaN(balance)||isNaN(target)||isNaN(drawdown)) return;
  if(editingId){ const idx=accounts.findIndex(a=>a.id===editingId); accounts[idx]={...accounts[idx],firm,size,balance,target,drawdown,gainDays:days}; }
  else accounts.push({id:nextId++,firm,size,balance,target,drawdown,gainDays:days,history:[]});
  closeModal(); save(); renderAccounts(); renderScenarios();
}

function deleteAccount(id) {
  if(!confirm('Supprimer ce compte ?')) return;
  accounts=accounts.filter(a=>a.id!==id);
  save(); renderAccounts(); renderScenarios();
}

load(); renderAccounts(); renderScenarios();
</script>
